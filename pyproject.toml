[project]
name = "vivet-auth"
version = "0.4.0"
description = "Vivet software licensing and authentication dashboard"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "sqlalchemy==2.0.43",
    "pydantic-settings==2.10.1",
    "python-jose[cryptography]==3.5.0",
    "passlib[argon2]==1.7.4",
    "cryptography==45.0.6",
    "python-multipart==0.0.20",
    "jinja2==3.1.6",
    "psycopg[binary]>=3.2.10",
    "httpx==0.28.1",
]

[tool.vercel]
entrypoint = "app.main:app"
